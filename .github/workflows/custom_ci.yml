name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'go test package pattern/flags to run; empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  module-zip:
    name: Module zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.0'
        cache: false

    - name: Build module zip helper
      run: |
        set -eux
        HELPER=$(mktemp -d)
        cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
        cd "$HELPER"
        go mod init example.com/mod
        go get golang.org/x/mod@v0.24.0
        go build -o "$RUNNER_TEMP/create_mod" .

    - name: Create module zip
      run: |
        set -eux
        mkdir -p "$RUNNER_TEMP/out"
        # .github only holds this build workflow and its helper; it is not part
        # of the published module zip.
        rm -rf "$GITHUB_WORKSPACE/.github"
        "$RUNNER_TEMP/create_mod" golang.org/x/crypto v0.36.0 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v0.36.0.zip"
        unzip -l "$RUNNER_TEMP/out/v0.36.0.zip" | tail -n 1

    - uses: actions/upload-artifact@v4
      with:
        name: module-zip
        path: ${{ runner.temp }}/out/v0.36.0.zip
        if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest (now 26.04): on 26.04 the system sshd
        # never sends its banner with the sshd_test_pw.so LD_PRELOAD shim loaded,
        # so ssh/test TestMultiAuth hangs until the go test timeout.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        include:
        - os: ubuntu-24.04
          race: '-race'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.0'
        cache: false

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: |
        set -eux
        go version
        go build -v ./...

    - name: Build sshd password test module
      if: runner.os == 'Linux'
      # ssh/test TestMultiAuth needs this PAM-less shim; it skips without it.
      run: gcc -Wall -shared -o ssh/test/sshd_test_pw.so -fPIC ssh/test/sshd_test_pw.c

    - name: Run tests
      run: |
        set -euxo pipefail
        SKIP=()
        if [ "$RUNNER_OS" = "macOS" ]; then
          # macOS runner TMPDIR (/var/folders/...) makes ssh-agent's Unix socket
          # path exceed the sun_path limit in ssh/agent tests; use a short one.
          export TMPDIR=/tmp
          # ssh/test tests that drive the system sshd: on macOS runners sshd-session
          # fails with "BSM audit: setaudit_addr failed" (golang/go#64959). Upstream
          # skips them via skipIfIssue64959, but the failure intermittently surfaces
          # as "NewSession: EOF" before that check runs. They run on Linux.
          SKIP=(-skip '^(TestAcceptClose.*|TestAgentForward|TestCiphers|TestDialTCP|TestDialUnix|TestFuncLargeRead|TestKeyChange|TestPortForward.*|TestRunCommand.*|TestValidTerminalMode|TestWindowChange)$')
        fi
        go test -v ${{ matrix.race }} "${SKIP[@]}" ${{ inputs.test-filter || './...' }} 2>&1 | tee "$RUNNER_TEMP/go-test.log"

    - name: Test summary
      if: always()
      run: |
        set -eu
        LOG="$RUNNER_TEMP/go-test.log"
        awk '
          { sub(/\r$/, "") }
          /^=== (RUN|CONT|NAME) / { cur = $3; next }
          /^[ \t]+[A-Za-z0-9_]+\.go:[0-9]+: / {
            m = $0; sub(/^[ \t]+/, "", m)
            if (cur != "" && !(tolower(msg[cur]) ~ /skip/ && tolower(m) !~ /skip/)) msg[cur] = m
            next
          }
          /^[ \t]*--- SKIP:/ {
            skip++
            name = $3; r = msg[name]
            if (r == "") r = "(no message)"
            skips[++ns] = "  SKIP " name " -- " r
            next
          }
          /^[ \t]*--- PASS:/ { pass++; next }
          /^[ \t]*--- FAIL:/ { fail++; next }
          /^(ok|FAIL|\?)[ \t]/ {
            if ($1 == "ok") pok++
            if ($1 == "FAIL") pfail++
            print
            for (i = 1; i <= ns; i++) print skips[i]
            ns = 0
            delete msg
            next
          }
          END {
            printf "packages ok: %d, packages FAIL: %d\n", pok, pfail
            printf "tests passed: %d, tests failed: %d, tests skipped: %d\n", pass, fail, skip
          }
        ' "$LOG"
